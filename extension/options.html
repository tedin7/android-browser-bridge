<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browser Bridge</title><style>body{font:18px system-ui;max-width:620px;margin:24px auto;padding:16px}label{display:block;margin:18px 0}input{font:inherit;box-sizing:border-box;width:100%;padding:10px}input[type=checkbox]{width:auto}button{font:inherit;padding:12px}#status{white-space:pre-wrap}</style>
<h1>Browser Bridge</h1><p>Collega questo browser al tuo terminale. Il controllo è attivo solo quando lo abiliti qui.</p>
<form id="config"><label>Collegamento ricevuto dal tuo MCP<input id="code" placeholder="BB1.…" autocomplete="off"></label>
<details><summary>Impostazioni avanzate</summary><label>Indirizzo servizio<input id="url" type="url" value="http://127.0.0.1:8766" required></label></details>
<p id="device"></p>
<label><input id="enabled" type="checkbox"> Abilita controllo remoto delle schede</label>
<button>Salva</button></form><p id="status"></p><script src="connection.js"></script><script src="options.js"></script></html>
